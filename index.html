        body {

        /* Skip Link */
        .skip-link {
            position: absolute;
            top: -40px; left: 0;
            background: var(--accent-purple); color: white;
            padding: 8px 16px; z-index: 1000; font-weight: 600;
        }
        .skip-link:focus { top: 0; }

        /* Header */
        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0;
            background: rgba(5, 2, 10, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; color: #fff; }

        /* --- HERO SECTION & TYPOGRAPHY --- */
        .hero {
            padding: 100px 0 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Background Particles */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: particle-float 20s linear infinite;
        }

        @keyframes particle-float {
            0% { background-position: 0% 0%; transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { background-position: 100% 100%; transform: scale(1); }
        }

        /* MEGA TITLE CONTAINER */
        .mega-title {
            /* Responsive clamping: Fits perfectly from iPhone SE to 4K screens */
            font-size: clamp(2.5rem, 9vw, 7.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* PART 1: EXALTATION (Transmutation Flow Effect) */
        .title-word {
            position: relative;
            /* Gradient: Deep Purple -> Cyan -> Gold (The Alchemy Spectrum) */
            background: linear-gradient(
                120deg, 
                #a855f7 0%, 
                #3b82f6 25%, 
                #06b6d4 50%, 
                #f59e0b 75%, 
                #a855f7 100%
            );
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* Flow Animation */
            animation: 
                alchemy-flow 8s linear infinite, 
                ascension-levitate 6s ease-in-out infinite;
            
            /* Soft Glow Filter */
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.3));
        }

        /* Ghost effect behind the text for depth */
        .title-word::after {
            content: 'Exaltation';
            position: absolute;
            left: 0; top: 0;
            z-index: -1;
            background: inherit;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(15px);
            opacity: 0.6;
            animation: alchemy-flow 8s linear infinite;
        }

        /* PART 2: .AI (The Golden Spark) */
        .title-tld {
            font-family: 'Space Grotesk', monospace;
            color: var(--accent-gold);
            -webkit-text-fill-color: var(--accent-gold);
            font-weight: 300;
            
            /* Intense Gold Glow */
            text-shadow: 
                0 0 10px rgba(251, 191, 36, 0.5),
                0 0 20px rgba(251, 191, 36, 0.3);
            
            /* Animation: Energetic Flicker */
            animation: spark-flicker 4s infinite;
        }

        /* ANIMATION KEYFRAMES */
        
        /* 1. Alchemy Flow: Moves the gradient texture */
        @keyframes alchemy-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 2. Ascension: Gentle lifting movement */
        @keyframes ascension-levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 3. Spark: Intelligence pulse */
        @keyframes spark-flicker {
            0%, 100% { opacity: 0.8; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            5% { opacity: 1; text-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
            10% { opacity: 0.8; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            50% { opacity: 0.9; }
        }

            text-align: center;
            transition: all 0.3s;
        }

            border-color: var(--accent-purple);
            transform: translateY(-5px);
